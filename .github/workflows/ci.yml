name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Unit tests (pure logic — no Docker/authorizer)
        run: uv run --with pytest pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Verify package metadata
        run: |
          uv run python -c "from tenuo_claude_code import __version__; assert __version__ == '0.1.2'"

      - name: Smoke test init in temp project
        run: |
          tmp=$(mktemp -d)
          cp tenuo.yaml.example "$tmp/tenuo.yaml"
          mkdir -p "$tmp/workspace"
          touch "$tmp/workspace/notes.txt"
          TENUO_PROJECT_DIR="$tmp" uv run tenuo-claude init
          test -f "$tmp/.state/warrant.b64"
          test -f "$tmp/.state/gateway.yaml"
          test -f "$tmp/.claude/settings.json"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  enforcement:
    name: Enforcement self-test (live authorizer)
    runs-on: ubuntu-latest
    # Proves the leash actually holds end to end: mints a local warrant, starts
    # the authorizer container, and runs `verify` (out-of-scope reads denied,
    # shell chaining blocked, unlisted tools default-denied). Needs Docker (on
    # ubuntu-latest) and the public tenuo/authorizer image.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Set up a local-mode project
        run: |
          proj="$RUNNER_TEMP/governed"
          mkdir -p "$proj/workspace"
          cp tenuo.yaml.example "$proj/tenuo.yaml"
          echo "TENUO_PROJECT_DIR=$proj" >> "$GITHUB_ENV"

      - name: init (mint local warrant + wire hooks)
        run: uv run tenuo-claude init

      - name: up (start authorizer container, local issuer)
        run: uv run tenuo-claude up

      - name: verify (policy self-test against the live authorizer)
        run: uv run tenuo-claude verify

      - name: Authorizer logs on failure
        if: failure()
        run: |
          echo "=== authorizer.log ==="
          cat "$TENUO_PROJECT_DIR/.state/authorizer.log" 2>/dev/null || true
          echo "=== docker ps -a ==="
          docker ps -a || true

      - name: down (stop authorizer)
        if: always()
        run: uv run tenuo-claude down || true
