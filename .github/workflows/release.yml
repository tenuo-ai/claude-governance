name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # trusted publishing (OIDC) when PYPI_TOKEN is unset

jobs:
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Build
        run: uv build

      - name: Publish to PyPI (token)
        if: ${{ secrets.PYPI_TOKEN != '' }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish

      - name: Publish to PyPI (trusted publishing)
        if: ${{ secrets.PYPI_TOKEN == '' }}
        run: |
          echo "No PYPI_TOKEN — using trusted publishing (OIDC)."
          echo "PyPI must list a pending publisher for:"
          echo "  owner=tenuo-ai  repo=claude-governance  workflow=release.yml"
          uv publish --trusted-publishing always
