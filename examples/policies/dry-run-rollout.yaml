# Rollout template: mode dry-run logs real allow/deny without blocking anything.
# Review WOULD-DENY in receipts or Cloud, tune policy, then set mode: enforce.
#
# Copy to tenuo.yaml in your project, then: tenuo-claude init && tenuo-claude up

name: dry-run-rollout

sandbox: ./workspace

mode: dry-run

enforce:
  Read: "subpath:{sandbox}"
  Bash: "shlex:ls,pwd,echo,date"

default: deny
