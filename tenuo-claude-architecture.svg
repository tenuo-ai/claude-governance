<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Tenuo + Claude Code</title>
<desc>The PreToolUse hook checks native and MCP tool names (cooperative veto). The MCP proxy structurally gates access to the downstream server. Both ask the Tenuo Authorizer.</desc>

<defs>
  <style type="text/css"><![CDATA[
    text { font-family: Inter, 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; }
    .brand { font-size: 22px; font-weight: 700; fill: #0B1220; }
    .title { font-size: 26px; font-weight: 700; fill: #0B1220; }
    .subtitle { font-size: 14px; font-weight: 500; fill: #667085; }
    .lane-title { font-size: 11px; font-weight: 700; fill: #1a6eff; letter-spacing: 1px; }
    .box-title { font-size: 15px; font-weight: 700; fill: #0B1220; }
    .box-desc { font-size: 12px; fill: #667085; }
    .box-note { font-size: 10px; fill: #98A2B3; }
    .arrow-label { font-size: 10px; fill: #667085; }
    .outcome { font-size: 11px; font-weight: 700; }
    .cloud-title { font-size: 12px; font-weight: 700; fill: #475467; }
    .cloud-item { font-size: 11.5px; fill: #667085; }
    .arrow { fill: none; stroke: #1a6eff; stroke-width: 2; stroke-linecap: round; }
    .arrow-soft { fill: none; stroke: #98A2B3; stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 6 4; }
  ]]></style>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
    <path d="M0,0 L7,4 L0,8 Z" fill="#1a6eff"/>
  </marker>
  <marker id="arr-soft" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
    <path d="M0,0 L7,4 L0,8 Z" fill="#98A2B3"/>
  </marker>
</defs>

<rect width="1200" height="700" fill="#ffffff"/>

<text x="40" y="40" class="brand">tenuo</text>
<text x="40" y="72" class="title">Tenuo + Claude Code</text>
<text x="40" y="94" class="subtitle">Every tool call is checked against policy before it runs</text>

<!-- policy row -->
<rect x="280" y="118" width="170" height="64" rx="10" fill="#F9FAFB" stroke="#E4E7EC" stroke-width="1.2"/>
<text x="365" y="144" class="box-title" text-anchor="middle">tenuo.yaml</text>
<text x="365" y="164" class="box-desc" text-anchor="middle">Defines allowed tools</text>

<path class="arrow" d="M450,150 L490,150" marker-end="url(#arr)"/>

<rect x="490" y="118" width="170" height="64" rx="10" fill="#ffffff" stroke="#1a6eff" stroke-width="1.4"/>
<text x="575" y="144" class="box-title" text-anchor="middle">init / up</text>
<text x="575" y="164" class="box-desc" text-anchor="middle">Builds warrant and wiring</text>

<path class="arrow" d="M575,182 L575,210" marker-end="url(#arr)"/>

<rect x="475" y="210" width="200" height="56" rx="10" fill="#ffffff" stroke="#E4E7EC" stroke-width="1.2"/>
<text x="575" y="234" class="box-title" text-anchor="middle">Claude Code</text>
<text x="575" y="252" class="box-desc" text-anchor="middle">Agent uses a tool</text>

<!-- lanes -->
<rect x="40" y="290" width="520" height="210" rx="12" fill="#FAFBFF" stroke="#D6E4FF" stroke-width="1"/>
<text x="56" y="310" class="lane-title">HOOK &#183; COOPERATIVE VETO</text>

<rect x="640" y="290" width="520" height="210" rx="12" fill="#FAFBFF" stroke="#D6E4FF" stroke-width="1"/>
<text x="656" y="310" class="lane-title">MCP PROXY &#183; STRUCTURAL GATE</text>

<path class="arrow" d="M540,266 L300,290" marker-end="url(#arr)"/>
<path class="arrow" d="M610,266 L860,290" marker-end="url(#arr)"/>

<!-- hook: native + MCP names -->
<rect x="120" y="330" width="360" height="88" rx="10" fill="#EFF4FF" stroke="#1a6eff" stroke-width="1.4"/>
<text x="300" y="356" class="box-title" text-anchor="middle">PreToolUse hook</text>
<text x="300" y="376" class="box-desc" text-anchor="middle">Checks native and MCP tool names</text>
<text x="300" y="392" class="box-desc" text-anchor="middle">Blocks if authorizer denies</text>
<text x="300" y="408" class="box-note" text-anchor="middle">Host process &#183; Claude must honor the decision</text>

<!-- mcp proxy path -->
<rect x="700" y="330" width="200" height="88" rx="10" fill="#EFF4FF" stroke="#1a6eff" stroke-width="1.4"/>
<text x="800" y="356" class="box-title" text-anchor="middle">MCP proxy</text>
<text x="800" y="376" class="box-desc" text-anchor="middle">Only path to MCP server</text>
<text x="800" y="392" class="box-desc" text-anchor="middle">Denied calls never forwarded</text>
<text x="800" y="408" class="box-note" text-anchor="middle">Host process &#183; no bypass route</text>

<path class="arrow" d="M900,374 L940,374" marker-end="url(#arr)"/>

<rect x="940" y="350" width="180" height="48" rx="10" fill="#ffffff" stroke="#E4E7EC" stroke-width="1.2"/>
<text x="1030" y="372" class="box-title" text-anchor="middle">MCP server</text>
<text x="1030" y="388" class="box-desc" text-anchor="middle">Your downstream tools</text>

<!-- hook also covers MCP (defense in depth) -->
<path class="arrow-soft" d="M480,374 L700,374"/>
<text x="560" y="366" class="arrow-label">hook also checks MCP names</text>

<!-- both ask authorizer -->
<path class="arrow" d="M300,418 L300,500 L575,500 L575,520" marker-end="url(#arr)"/>
<path class="arrow" d="M800,418 L800,500 L575,500"/>
<text x="318" y="462" class="arrow-label">asks authorizer</text>
<text x="812" y="462" class="arrow-label">asks authorizer</text>

<rect x="395" y="520" width="360" height="76" rx="12" fill="#0B1220" stroke="#1a6eff" stroke-width="2"/>
<text x="575" y="550" class="box-title" text-anchor="middle" fill="#ffffff">Tenuo Authorizer</text>
<text x="575" y="570" class="box-desc" text-anchor="middle" fill="#CBD5E1">Enforces the warrant on every call</text>
<text x="575" y="586" class="box-note" text-anchor="middle" fill="#94A3B8">Docker container &#183; policy decision only</text>

<path class="arrow" d="M575,596 L575,614" marker-end="url(#arr)"/>

<rect x="455" y="614" width="68" height="26" rx="13" fill="#ECFDF3" stroke="#12B76A" stroke-width="1"/>
<text x="489" y="631" class="outcome" fill="#027A48" text-anchor="middle">Allow</text>

<rect x="533" y="614" width="68" height="26" rx="13" fill="#FEF3F2" stroke="#F04438" stroke-width="1"/>
<text x="567" y="631" class="outcome" fill="#B42318" text-anchor="middle">Deny</text>

<rect x="611" y="614" width="84" height="26" rx="13" fill="#FFFAEB" stroke="#F79009" stroke-width="1"/>
<text x="653" y="631" class="outcome" fill="#B54708" text-anchor="middle">Approval</text>

<rect x="40" y="658" width="1120" height="28" rx="8" fill="#F9FAFB" stroke="#E4E7EC" stroke-width="1"/>
<text x="56" y="677" class="cloud-title">Tenuo Cloud (optional)</text>
<text x="220" y="677" class="cloud-item">Issues warrants</text>
<text x="380" y="677" class="cloud-item">&#183;</text>
<text x="400" y="677" class="cloud-item">Central audit log</text>
<text x="560" y="677" class="cloud-item">&#183;</text>
<text x="580" y="677" class="cloud-item">Human approval</text>

<path class="arrow-soft" d="M575,658 L575,118"/>
</svg>
